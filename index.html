<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Recap AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0d12;
  color: white;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 30px 20px;
  text-align: center;
}

h1 {
  margin-top: 30px;
  font-size: 32px;
}

p {
  color: #aaa;
}

.upload-box {
  margin-top: 30px;
  padding: 35px 20px;
  border: 2px dashed #555;
  border-radius: 18px;
  background: #151820;
}

input[type="file"] {
  margin-top: 20px;
  width: 100%;
}

button {
  margin-top: 25px;
  padding: 14px 25px;
  border: 0;
  border-radius: 10px;
  background: #5865f2;
  color: white;
  font-size: 16px;
}

#status {
  margin-top: 25px;
  color: #00ff99;
}
</style>
</head>

<body>

<div class="container">

  <h1>🎬 Movie Recap AI</h1>

  <p>Movie video ကို upload လုပ်ပြီး Recap ပြုလုပ်ပါ</p>

  <div class="upload-box">

    <h2>📤 Upload Movie</h2>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <br>

    <button onclick="uploadVideo()">
      Generate Recap
    </button>

    <div id="status"></div>

  </div>

</div>

<script>

function uploadVideo() {

  const file = document.getElementById("videoFile").files[0];
  const status = document.getElementById("status");

  if (!file) {
    status.innerText = "⚠️ Video တစ်ခုရွေးပါ";
    return;
  }

  status.innerText = "⏳ Video ကိုစစ်ဆေးနေပါတယ်...";

  setTimeout(() => {
    status.innerText =
      "✅ Video ရပါပြီ။ AI Recap Server ချိတ်ဆက်ဖို့ အဆင်သင့်ဖြစ်ပါပြီ။";
  }, 1500);

}

</script>

</body>
</html>
