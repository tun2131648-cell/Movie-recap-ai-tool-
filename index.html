<!DOCTYPE html>
<html lang="my">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Movie Recap AI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

<h1>🎬 Movie Recap AI</h1>

<p class="subtitle">
Video တင်ရုံနဲ့ Movie Recap MP4
</p>


<section class="card">

<h2>📤 Upload Video</h2>

<input
id="videoInput"
type="file"
accept="video/*"
>

<p id="fileName">
Video မရွေးရသေးပါ
</p>

</section>


<section
class="card"
id="originalSection"
hidden
>

<h2>▶️ Original Video</h2>

<video
id="originalVideo"
controls
playsinline
></video>

</section>


<section
class="card"
id="processingSection"
hidden
>

<h2>⚙️ AI Processing</h2>

<p id="status">
Processing...
</p>

<div class="progress">
<div
id="progressBar"
class="progressBar"
></div>
</div>

<p id="progressText">
0%
</p>

</section>


<!-- AFTER VIDEO -->

<section
class="card"
id="afterSection"
hidden
>

<h2>🎬 After Video Preview</h2>

<p class="small">
မူရင်းစာတန်းကို Blur လုပ်ထားပြီး
မြန်မာအသံ + မြန်မာစာတန်း ထည့်ထားပါတယ်။
</p>

<video
id="afterVideo"
controls
playsinline
></video>


<hr>


<h2>🎚️ Subtitle Settings</h2>


<label>
စာတန်းနေရာ
</label>

<select id="position">

<option value="15">
အပေါ်
</option>

<option value="50">
အလယ်
</option>

<option value="82" selected>
အောက်
</option>

</select>


<label>
စာတန်းအရွယ်အစား
</label>

<input
id="fontSize"
type="range"
min="32"
max="90"
value="58"
>

<p>
Size:
<span id="fontSizeValue">
58
</span>
</p>


<label>
စာတန်းအရောင်
</label>

<select id="color">

<option value="&H00FFFFFF">
အဖြူ
</option>

<option value="&H0000FFFF">
အဝါ
</option>

<option value="&H0000FF00">
အစိမ်း
</option>

</select>


<button
id="applyButton"
>
🎬 Apply & Create MP4
</button>

</section>


<section
class="card"
id="finalSection"
hidden
>

<h2>✅ Final MP4</h2>

<video
id="finalVideo"
controls
playsinline
></video>


<a
id="downloadButton"
class="downloadButton"
download="movie-recap-ai.mp4"
>
⬇️ Download MP4
</a>

</section>


</main>

<script src="script.js?v=2"></script>

</body>
</html>
