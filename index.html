<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Recap AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0d12;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 30px 20px;
}

h1 {
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 25px;
}

.box {
  background: #151821;
  padding: 20px;
  border-radius: 16px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 20px;
  background: #222630;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
}

video {
  width: 100%;
  max-height: 350px;
  display: none;
  margin-bottom: 20px;
  border-radius: 12px;
  background: black;
}

button,
.download {
  display: block;
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 10px;
  background: #5865f2;
  color: white;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

#status {
  text-align: center;
  margin-top: 20px;
}

#processing {
  display: none;
  margin-top: 25px;
}

.progress-box {
  width: 100%;
  height: 15px;
  background: #292d38;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #5865f2;
  transition: width 0.2s;
}

#percent {
  text-align: center;
  margin-top: 10px;
  color: #aaa;
}

#downloadBox {
  display: none;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Movie Recap AI</h1>

<div class="subtitle">
Video တင်ပြီး Recap MP4 ရယူပါ
</div>

<div class="box">

<input
  type="file"
  id="videoFile"
  accept="video/*"
>

<video
  id="preview"
  controls>
</video>

<button
  id="uploadButton"
  type="button">
🎬 Generate Recap
</button>

<div id="status"></div>

<div id="processing">

<div class="progress-box">
<div

  id="progress
