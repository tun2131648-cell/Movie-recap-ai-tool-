<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Recap AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0d12;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 30px 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 25px;
}

.box {
  background: #151821;
  padding: 20px;
  border-radius: 16px;
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  margin-bottom: 20px;
  background: #222630;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
}

video {
  width: 100%;
  max-height: 350px;
  display: none;
  margin-bottom: 20px;
  border-radius: 12px;
  background: black;
}

button {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 10px;
  background: #5865f2;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

button:disabled {
  opacity: 0.5;
}

#status {
  text-align: center;
  margin-top: 20px;
  line-height: 1.5;
}

#processing {
  display: none;
  margin-top: 25px;
}

.processing-title {
  text-align: center;
  font-size: 18px;
  margin-bottom: 15px;
}

.progress-box {
  width: 100%;
  height: 15px;
  background: #292d38;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: #5865f2;
  transition: width 0.2s;
}

#percent {
  text-align: center;
  margin-top: 10px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Movie Recap AI</h1>

<div class="subtitle">
Video တင်ပြီး AI Recap ပြုလုပ်ပါ
</div>

<div class="box">

<input
  type="file"
  id="videoFile"
  accept="video/*"
>

<video
  id="preview"
  controls>
</video>

<button
  id="uploadButton"
  type="button">
🎬 Generate Recap
</button>

<div id="status"></div>

<div id="processing">

<div class="processing-title">
🎬 Video Processing...
</div>

<div class="progress-box">
<div
  class="progress-bar"
  id="progressBar">
</div>
</div>

<div id="percent">
0%
</div>

</div>

</div>

</div>

<script>

const videoFile =
document.getElementById("videoFile");

const preview =
document.getElementById("preview");

const button =
document.getElementById("uploadButton");

const status =
document.getElementById("status");

const processing =
document.getElementById("processing");

const progressBar =
document.getElementById("progressBar");

const percent =
document.getElementById("percent");


videoFile.addEventListener("change", function() {

  const file = videoFile.files[0];

  if (!file) {
    return;
  }

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

  status.innerText =
    "✅ Video ရွေးပြီးပါပြီ";

});


button.addEventListener("click", async function() {

  const file =
    videoFile.files[0];

  if (!file) {

    status.innerText =
      "⚠️ အရင်ဆုံး Video ရွေးပါ";

    return;
  }

  button.disabled = true;

  processing.style.display =
    "block";

  status.innerText =
    "⏳ Video ကို Server ဆီပို့နေပါတယ်...";

  let progress = 0;

  progressBar.style.width = "0%";
  percent.innerText = "0%";


  const timer =
  setInterval(function() {

    if (progress < 90) {

      progress++;

      progressBar.style.width =
        progress + "%";

      percent.innerText =
        progress + "%";
    }

  }, 150);


  const formData =
    new FormData();

  formData.append(
    "video",
    file
  );


  try {

    const response =
      await fetch(
        "https://movie-recap-ai-tool.onrender.com/upload",
        {
          method: "POST",
          body: formData
        }
      );


    const data =
      await response.json();


    clearInterval(timer);


    if (response.ok) {

      progressBar.style.width =
        "100%";

      percent.innerText =
        "100%";

      status.innerText =
        "✅ Video Server ကိုရောက်ပါပြီ!";

    } else {

      status.innerText =
        "❌ " +
        (data.error || "Upload failed");

    }


  } catch (error) {

    clearInterval(timer);

    status.innerText =
      "❌ Server ချိတ်ဆက်မရပါ";

  }


  button.disabled = false;

});

</script>

</body>
</html>
