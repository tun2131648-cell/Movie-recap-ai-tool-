<script>
async function uploadVideo() {
  const file = document.getElementById("videoFile").files[0];
  const status = document.getElementById("status");

  if (!file) {
    status.innerText = "⚠️ Video တစ်ခုရွေးပါ";
    return;
  }

  status.innerText = "⏳ Server ကိုပို့နေပါတယ်...";

  const formData = new FormData();
  formData.append("video", file);

  try {
    const response = await fetch(
      "https://movie-recap-ai-tool.onrender.com/upload",
      {
        method: "POST",
        body: formData
      }
    );

    const data = await response.json();

    if (response.ok) {
      status.innerText = "✅ Video Server ကိုရောက်ပါပြီ!";
    } else {
      status.innerText = "❌ " + (data.error || "Upload failed");
    }
  } catch (error) {
    status.innerText = "❌ Server ချိတ်ဆက်မရပါ";
    console.error(error);
  }
}
</script>
