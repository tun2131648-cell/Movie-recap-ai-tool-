<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Recap AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0d12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .box {
      background: #151821;
      padding: 20px;
      border-radius: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      background: #222630;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
    }

    video {
      width: 100%;
      max-height: 350px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: black;
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎬 Movie Recap AI</h1>

    <div class="subtitle">
      Video တင်ပြီး AI Recap ပြုလုပ်ပါ
    </div>

    <div class="box">

      <input
        type="file"
        id="videoFile"
        accept="video/*"
      >

      <video
        id="preview"
        controls
      ></video>

      <button
        id="uploadButton"
        onclick="uploadVideo()"
      >
        🎬 Generate Recap
      </button>

      <div id="status"></div>

    </div>

  </div>


  <script>

    // Video ရွေးတဲ့အခါ Preview ပြမယ်
    document.getElementById("videoFile").addEventListener("change", function () {

      const file = this.files[0];
      const preview = document.getElementById("preview");
      const status = document.getElementById("status");

      if (!file) {
        preview.style.display = "none";
        return;
      }

      const videoURL = URL.createObjectURL(file);

      preview.src = videoURL;
      preview.style.display = "block";

      status.innerText = "✅ Video ရွေးပြီးပါပြီ";

    });

      const status = document.getElementById("status");
