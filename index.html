<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Recap AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>🎬 Movie Recap AI</h1>

    <p class="subtitle">
      Video တင်ရုံနဲ့ မြန်မာစာတန်း + မြန်မာအသံ အလိုအလျောက်ပြုလုပ်ပေးမယ်
    </p>


    <!-- Upload -->

    <section class="card">

      <h2>📤 Video Upload</h2>

      <input
        type="file"
        id="videoInput"
        accept="video/*"
      >

      <p id="fileName">
        Video မရွေးရသေးပါ
      </p>

    </section>


    <!-- Preview -->

    <section
      class="card"
      id="previewSection"
      hidden
    >

      <h2>▶️ Video Preview</h2>

      <video
        id="videoPreview"
        controls
        playsinline
      ></video>

    </section>


    <!-- Generate -->

    <section class="card">

      <button
        id="generateButton"
        type="button"
      >
        🤖 AI Generate
      </button>

    </section>


    <!-- Processing -->

    <section
      class="card"
      id="processingSection"
      hidden
    >

      <h2>⚙️ Processing</h2>

      <p id="statusText">
        AI က Video ကိုလုပ်ဆောင်နေပါတယ်...
      </p>

      <div class="progress">
        <div
          id="progressBar"
          class="progress-bar"
        ></div>
      </div>

      <p id="progressText">
        0%
      </p>

    </section>


    <!-- Result -->

    <section
      class="card"
      id="resultSection"
      hidden
    >

      <h2>✅ ပြီးပါပြီ</h2>

      <p>
        မြန်မာစာတန်းနဲ့ မြန်မာအသံပါဝင်တဲ့ MP4 ကို ရယူနိုင်ပါပြီ။
      </p>

      <a
        id="downloadButton"
        class="download-button"
        href="#"
        download
      >
        ⬇️ Download MP4
      </a>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
