<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Recap AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
    }

    input {
      width: 100%;
      margin: 25px 0;
      padding: 12px;
      background: #181b22;
      color: white;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    #status {
      margin-top: 25px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎬 Movie Recap AI</h1>
    <p>Video တင်ပြီး AI Recap ပြုလုပ်ပါ</p>

    <input type="file" id="videoFile" accept="video/*">

    <button onclick="uploadVideo()">
      Generate Recap
    </button>

    <div id="status"></div>
  </div>

  <script>
    async function uploadVideo() {
      const file = document.getElementById("videoFile").files[0];
      const status = document.getElementById("status");

      if (!file) {
        status.innerText = "⚠️ Video တစ်ခုရွေးပါ";
        return;
      }

      status.innerText = "⏳ Server ကိုပို့နေပါတယ်...";

      const formData = new FormData();
      formData.append("video", file);

      try {
        const response = await fetch(
          "https://movie-recap-ai-tool.onrender.com/upload",
          {
            method: "POST",
            body: formData
          }
        );

        const data = await response.json();

        if (response.ok) {
          status.innerText = "✅ Video Server ကိုရောက်ပါပြီ!";
        } else {
          status.innerText = "❌ " + (data.error || "Upload failed");
        }

      } catch (error) {
        status.innerText = "❌ Server ချိတ်ဆက်မရပါ";
        console.error(error);
      }
    }
  </script>

</body>
</html>
