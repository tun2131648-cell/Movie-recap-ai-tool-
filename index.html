<!DOCTYPE html>
<html lang="my">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Movie Recap AI</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>


<body>

<main class="container">

<h1>🎬 Movie Recap AI</h1>

<p class="subtitle">
Video တင်ရုံနဲ့ မြန်မာအသံ + မြန်မာစာတန်း + MP4
</p>


<section class="card">

<h2>📤 Upload Video</h2>

<input
  type="file"
  id="videoInput"
  accept="video/*"
>

<p id="fileName">
Video မရွေးရသေးပါ
</p>

</section>



<section
  class="card"
  id="previewSection"
  hidden
>

<h2>▶️ Original Video</h2>

<video
  id="videoPreview"
  controls
  playsinline
></video>

</section>



<section
  class="card"
  id="customSection"
  hidden
>

<h2>🎚️ Subtitle Position</h2>

<p>
စာတန်းနေရာ —
<span id="positionValue">
82%
</span>
</p>

<input
  type="range"
  id="subtitleY"
  min="8"
  max="92"
  value="82"
>

<div class="positionLabels">

<span>အပေါ်</span>

<span>အလယ်</span>

<span>အောက်</span>

</div>

</section>



<section class="card">

<button
  id="generateButton"
>

🤖 AI Generate MP4

</button>

</section>



<section
  class="card"
  id="processingSection"
  hidden
>

<h2>⚙️ Processing</h2>

<p id="statusText">
AI က Video ကိုလုပ်ဆောင်နေပါတယ်...
</p>

<div class="progress">

<div
  id="progressBar"
  class="progressBar"
></div>

</div>

<p id="progressText">
0%
</p>

</section>



<section
  class="card"
  id="resultSection"
  hidden
>

<h2>🎬 After Video</h2>

<video
  id="resultVideo"
  controls
  playsinline
></video>


<a
  id="downloadButton"
  class="downloadButton"
  href="#"
  download="movie-recap-ai.mp4"
>

⬇️ Download MP4

</a>

</section>


</main>


<script src="script.js"></script>

</body>

</html>
