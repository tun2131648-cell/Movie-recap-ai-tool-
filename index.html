<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Recap AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0d12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    .box {
      background: #151821;
      padding: 20px;
      border-radius: 16px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      background: #222630;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
    }

    video {
      width: 100%;
      max-height: 350px;
      border-radius: 12px;
      background: black;
      display: none;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      text-align: center;
      margin-top: 20px;
      color: #ddd;
    }

    #processing {
      display: none;
      margin-top: 25px;
    }

    .processing-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .progress-box {
      width: 100%;
      height: 14px;
      background: #292d38;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #5865f2;
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    #percent {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #aaa;
    }
